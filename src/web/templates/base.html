<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}AcessoLab{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a class="marca" href="{{ url_for('inicio') }}">AcessoLab</a>
        <nav>
            <a href="{{ url_for('inicio') }}">Painel</a>
            <a href="{{ url_for('alunos') }}">Alunos</a>
            <a href="{{ url_for('historico') }}">Histórico</a>
        </nav>
    </header>

    <main>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alerta {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
